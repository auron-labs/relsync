# Builds the Windows installers for amd64 and arm64 when a version tag is
# pushed and attaches them, with their signed update files, to a draft release.
# It needs `updates.github` in mygo.json, and the update signing key as the
# MYGO_UPDATER_PRIVATE_KEY secret (`go tool mygo keygen` makes the pair). Set a
# SENTRY_DSN secret to compile an error-reporting DSN into the build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_LDFLAGS: -X github.com/auron-labs/mygo-framework/errorreport.buildDSN=${{ secrets.SENTRY_DSN }}
        run: go tool mygo build -platform "windows/amd64,windows/arm64" -upload
